services:
  - type: web
    name: mercadobra
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run migrate && npm run db:check && npm run admin:bootstrap
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://mercadobra.com,https://mercadobra.vercel.app
      - key: FRONTEND_PUBLIC_URL
        value: https://mercadobra.com
      - key: BACKEND_PUBLIC_URL
        value: https://mercadobra.onrender.com
      - key: REQUIRE_DATABASE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: contacto@mercadobra.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_COMPANY
        value: Mercadobra
      - key: LEADS_NOTIFICATION_EMAIL
        value: contacto@mercadobra.com
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: mercadobra/products
      - key: OPENAI_API_KEY
        sync: false
